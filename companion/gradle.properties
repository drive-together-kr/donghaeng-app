# companion 빌드 설정 (JDK 경로 같은 로컬 값은 여기 두지 않는다 — CLAUDE.md 규칙 11)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# 데모 호스트 앱이 바라보는 서버 공개 주소(BuildConfig.DH_PUBLIC_BASE_URL).
# 기본값은 에뮬레이터 → 호스트 PC. 클라우드 검증 시 -PdhPublicBaseUrl=https://<VM-IP>.sslip.io 로 덮어쓴다.
