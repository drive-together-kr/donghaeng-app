# car-app 빌드 설정 (JDK 경로 같은 로컬 값은 여기 두지 않는다 — CLAUDE.md 규칙 11)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
