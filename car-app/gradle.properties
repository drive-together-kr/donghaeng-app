# car-app 빌드 설정 (JDK 경로 같은 로컬 값은 여기 두지 않는다 — CLAUDE.md 규칙 11)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 서버 주소 기본값 (T32, app/build.gradle.kts)
#   debug  : 아래 dhPublicBaseUrl / dhMqttPublicUri (에뮬레이터 → 호스트). -PdhPublicBaseUrl=… -PdhMqttPublicUri=… 로 덮어쓸 수 있다.
#   release: dhCloudHost 가 있으면 https://{dhCloudHost} · ssl://{dhCloudHost}:8883 (클라우드 기본, WSS 폴백 wss://{dhCloudHost}/mqtt 는 앱이 파생).
#            비어 있으면 debug 값을 쓰고 Gradle 경고만 낸다. VM IP 를 받으면 여기 채우거나 -PdhCloudHost=1-2-3-4.sslip.io 로 준다(공개 주소 — 비밀 아님).
dhPublicBaseUrl=http://10.0.2.2:8080
dhMqttPublicUri=tcp://10.0.2.2:1883
dhCloudHost=
