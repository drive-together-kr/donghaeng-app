# 동행 서버 기본 설정. 환경 변수로 덮어쓴다 (README 의 환경 변수 표 참고).
spring:
  application:
    name: donghaeng-server
  datasource:
    # 로컬: infra/docker-compose 의 postgres 가 호스트 15432 에 뜬다 (로컬 PostgreSQL 이 5432 점유).
    url: ${DH_DB_URL:jdbc:postgresql://localhost:15432/donghaeng}
    username: ${DH_DB_USER:dh}
    password: ${DH_DB_PASSWORD:dh}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${DH_REDIS_HOST:localhost}
      port: ${DH_REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# docs/03 머리말: 공개 주소는 고정 도메인 없이 설정값으로만 만든다.
dh:
  public-base-url: ${DH_PUBLIC_BASE_URL:http://10.0.2.2:8080}
  mqtt:
    uri: ${DH_MQTT_URI:tcp://localhost:1883}
    public-uri: ${DH_MQTT_PUBLIC_URI:tcp://10.0.2.2:1883}
    # false 면 서버가 브로커에 붙지 않는다(브로커 없는 로컬 실행·웹 테스트). cmd·그룹 이벤트 발행은 로그로만 남는다.
    enabled: ${DH_MQTT_ENABLED:true}
  # EMQX ACL 훅(POST /internal/mqtt/acl)의 X-Internal-Token. 비우면 검사하지 않음(로컬). 클라우드에서는 필수.
  internal-token: ${DH_INTERNAL_TOKEN:}
  jwt:
    # RS256 개인키 (PKCS#8 PEM, 한 줄 `\n` 이스케이프 허용). 비우면 기동 시 개발용 키 생성(WARN, 재시작마다 바뀜).
    private-key-pem: ${DH_JWT_PRIVATE_KEY_PEM:}
  # CarInfo 차량 ID 해시 salt (docs/04 vehicle.car_info_id_hash). 운영에서는 반드시 바꾸고, 바꾼 뒤에는 유지한다.
  car-id-salt: ${DH_CAR_ID_SALT:dev-salt-change-me}
