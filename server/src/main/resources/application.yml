# 동행 서버 기본 설정. 환경 변수로 덮어쓴다 (README 의 환경 변수 표 참고).
spring:
  application:
    name: donghaeng-server
  datasource:
    # 로컬: infra/docker-compose 의 postgres 가 호스트 15432 에 뜬다 (로컬 PostgreSQL 이 5432 점유).
    url: ${DH_DB_URL:jdbc:postgresql://localhost:15432/donghaeng}
    username: ${DH_DB_USER:dh}
    password: ${DH_DB_PASSWORD:dh}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${DH_REDIS_HOST:localhost}
      port: ${DH_REDIS_PORT:6379}
      # 클라우드(T32)는 Redis requirepass 를 건다. 비우면 AUTH 를 보내지 않는다(로컬 compose·Testcontainers 무영향).
      password: ${DH_REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  # multipart 본문은 F16 무전 업로드(POST /v1/groups/{id}/voice, docs/03 §2.6)뿐이다. 파일 상한 = 계약의 512 KB(=524288 B, 같으면 허용),
  # 요청 전체는 폼 필드·경계 여유를 두고 1MB(클라우드 Caddy request_body 와 같음). 넘으면 컨트롤러 전에 413 VOICE_TOO_LARGE(GlobalExceptionHandler).
  servlet:
    multipart:
      max-file-size: 512KB
      max-request-size: 1MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# docs/03 머리말: 공개 주소는 고정 도메인 없이 설정값으로만 만든다.
dh:
  public-base-url: ${DH_PUBLIC_BASE_URL:http://10.0.2.2:8080}
  # 폰 앱 App Links(/.well-known/assetlinks.json) — 비우면 빈 목록. 기본값은 demo-host 릴리스 키(공개 값)
  app-links:
    package-name: ${DH_APP_LINKS_PACKAGE:app.donghaeng.companion.demo}
    sha256: ${DH_APP_LINKS_SHA256:25:24:46:02:6A:78:9E:55:1B:77:8E:95:43:18:84:B4:8D:DB:28:6E:30:94:2F:F0:63:0A:EF:58:6D:10:82:AB}
  mqtt:
    uri: ${DH_MQTT_URI:tcp://localhost:1883}
    public-uri: ${DH_MQTT_PUBLIC_URI:tcp://10.0.2.2:1883}
    # false 면 서버가 브로커에 붙지 않는다(브로커 없는 로컬 실행·웹 테스트). cmd·그룹 이벤트 발행은 로그로만 남는다.
    enabled: ${DH_MQTT_ENABLED:true}
  # EMQX ACL 훅(POST /internal/mqtt/acl)의 X-Internal-Token. 비우면 검사하지 않음(로컬). 클라우드에서는 필수.
  internal-token: ${DH_INTERNAL_TOKEN:}
  auth:
    # dev 간편 로그인(POST /v1/auth/login) 공유 키 — 요청 헤더 X-Dev-Login-Key 가 같아야 한다(아니면 403). 비우면 검사하지 않음(로컬).
    # 클라우드(T32)에서는 필수: 공개 VM 에서 이메일만으로 남의 dev 계정 토큰을 받지 못하게 한다.
    dev-login-key: ${DH_DEV_LOGIN_KEY:}
  # presence(T24): 그룹 state 스냅샷 주기(ms)·오프라인/정차 판정(ms)·도착 반경(m)·Redis 상태 TTL(s)
  presence:
    snapshot-interval-ms: ${DH_SNAPSHOT_INTERVAL_MS:2000}
    offline-after-ms: 60000
    stopped-after-ms: 60000
    arrived-radius-m: 150
    state-ttl-seconds: 600
  jwt:
    # RS256 개인키 (PKCS#8 PEM, 한 줄 `\n` 이스케이프 허용). 비우면 기동 시 개발용 키 생성(WARN, 재시작마다 바뀜).
    private-key-pem: ${DH_JWT_PRIVATE_KEY_PEM:}
  # F16 무전 보관 정리(VoiceRetention): 만료(업로드 + 24h) 무전 삭제 주기(ms). 그룹 종료 시 삭제는 즉시(GROUP_ENDED), 다운로드는 만료 시각을 직접 비교한다.
  voice:
    purge-interval-ms: ${DH_VOICE_PURGE_INTERVAL_MS:600000}
  # 빈도 제한(docs/03 §1·§2.3): 로그인·디바이스 코드 발급은 IP 당 분당 30회, 동승자 메시지는 그룹당 2초에 1건 → 429 RATE_LIMITED(+Retry-After). 0 이면 끔.
  rate-limit:
    ip-per-minute: ${DH_RATE_LIMIT_IP_PER_MINUTE:30}
    passenger-message-interval-ms: ${DH_RATE_LIMIT_MESSAGE_INTERVAL_MS:2000}
  # 보관 정리(1시간마다): group_event 24h 초과·만료 디바이스 코드(+1h)·만료 초대(+1일)·만료 refresh·만료 재시도 키(docs/06 §3)
  retention:
    interval-ms: ${DH_RETENTION_INTERVAL_MS:3600000}
    initial-delay-ms: ${DH_RETENTION_INITIAL_DELAY_MS:120000}
  # CarInfo 차량 ID 해시 salt (docs/04 vehicle.car_info_id_hash). 운영에서는 반드시 바꾸고, 바꾼 뒤에는 유지한다.
  car-id-salt: ${DH_CAR_ID_SALT:dev-salt-change-me}
